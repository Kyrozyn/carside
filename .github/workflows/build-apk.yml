name: Build Android APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Calculate Version
        id: version
        run: |
          BASE_OFFSET=22
          V_CODE=$((BASE_OFFSET + GITHUB_RUN_NUMBER))
          V_NAME="1.0.${V_CODE}"
          echo "VERSION_CODE=${V_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${V_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${V_CODE}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${V_NAME}" >> $GITHUB_OUTPUT

      - name: Build APKs & AAB (Release & Debug)
        env:
          KEYSTORE_FILE: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PVERSION_CODE="${VERSION_CODE}" \
            -PVERSION_NAME="${VERSION_NAME}" \
            -PKEYSTORE_FILE="${KEYSTORE_FILE}" \
            -PKEYSTORE_PASSWORD="${KEYSTORE_PASSWORD}" \
            -PKEY_ALIAS="${KEY_ALIAS}" \
            -PKEY_PASSWORD="${KEY_PASSWORD}" \
            --no-daemon

      - name: Prepare Artifacts
        run: |
          mkdir -p build-apks
          cp app/build/outputs/apk/release/app-release.apk build-apks/carside-release.apk || true
          cp app/build/outputs/bundle/release/app-release.aab build-apks/carside-release.aab || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carside-artifacts
          path: build-apks/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "Carside v${{ env.VERSION_NAME }}"
          files: |
            build-apks/carside-release.apk
            build-apks/carside-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
