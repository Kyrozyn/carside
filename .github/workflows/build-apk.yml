name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs (Release & Debug)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p build-apks
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk build-apks/carside-release.apk
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-apks/carside-debug.apk
          fi
          echo "Daftar APK yang berhasil di-build:"
          ls -lh build-apks/

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carside-apk
          path: build-apks/*
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: latest
          name: "Carside Latest Build"
          body: |
            ## 🚗 Carside Automated APK Build
            
            Build otomatis dari branch `main`.
            
            - **Commit**: ${{ github.sha }}
            - **Branch**: main
            
            ### 📥 Download File APK:
            - **carside-release.apk**: Versi Release (teroptimasi, signed, siap install di HP)
            - **carside-debug.apk**: Versi Debug (signed, siap install di HP)
          files: |
            build-apks/carside-release.apk
            build-apks/carside-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
