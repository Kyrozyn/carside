name: Build Android APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Ensure Android debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs & AAB (Release & Debug)
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease assembleDebug bundleRelease --stacktrace

      - name: Prepare Artifacts (APKs & AAB)
        run: |
          mkdir -p build-apks
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk build-apks/carside-release.apk
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-apks/carside-debug.apk
          fi
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp app/build/outputs/bundle/release/app-release.aab build-apks/carside-release.aab
          fi
          echo "Daftar file build yang berhasil dibuat:"
          ls -lh build-apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carside-artifacts
          path: build-apks/*
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: latest
          name: "Carside Latest Build"
          body: |
            ## 🚗 Carside Automated Build
            
            Build otomatis dari branch `main`.
            
            - **Commit**: ${{ github.sha }}
            - **Branch**: main
            
            ### 📥 Download File:
            - **carside-release.apk**: Versi Release APK (teroptimasi, signed, siap install di HP/Head Unit)
            - **carside-debug.apk**: Versi Debug APK (signed, siap install di HP/Head Unit)
            - **carside-release.aab**: Android App Bundle Release (untuk Google Play Store)
          files: |
            build-apks/carside-release.apk
            build-apks/carside-debug.apk
            build-apks/carside-release.aab
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
